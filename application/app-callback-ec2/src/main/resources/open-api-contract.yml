  openapi: 3.0.0
  info:
    title: API de Gerenciamento de TaskToken
    version: 1.0.0
    description: API para gerenciamento de taskToken no DynamoDB e Step Functions.
  servers:
    - url: http://localhost:8080
      description: Servidor de Desenvolvimento
  paths:
    /tasks/{taskToken}:
      post:
        summary: Atualiza o status de uma taskToken
        parameters:
          - name: taskToken
            in: path
            required: true
            schema:
              type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [PENDING, APPROVED, REJECTED]
        responses:
          '200':
            description: Status atualizado com sucesso
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
  components:
    schemas:
      TaskToken:
        type: object
        properties:
          businessKey:
            type: string
          executionStartTime:
            type: string
          executionId:
            type: string
          taskToken:
            type: string
          status:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        required:
          - businessKey
          - executionStartTime
          - executionId
          - taskToken
          - status
